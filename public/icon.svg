<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Habit Tracker Calendar">
  <title>Habit Tracker Calendar</title>
  <rect width="32" height="32" rx="8" fill="#0d0f10"/>
  <rect x="0.35" y="0.35" width="31.3" height="31.3" rx="7.65" fill="none" stroke="#2a3034" stroke-width="0.7"/>
  <g fill="#ffffff">
    <!-- unlogged days: the grid the habit lives on -->
    <g opacity="0.15">
      <rect x="3"  y="3"  width="5" height="5" rx="1.4"/>
      <rect x="10" y="3"  width="5" height="5" rx="1.4"/>
      <rect x="17" y="3"  width="5" height="5" rx="1.4"/>
      <rect x="24" y="3"  width="5" height="5" rx="1.4"/>
      <rect x="3"  y="10" width="5" height="5" rx="1.4"/>
      <rect x="10" y="10" width="5" height="5" rx="1.4"/>
      <rect x="17" y="10" width="5" height="5" rx="1.4"/>
      <rect x="10" y="17" width="5" height="5" rx="1.4"/>
      <rect x="24" y="17" width="5" height="5" rx="1.4"/>
      <rect x="3"  y="24" width="5" height="5" rx="1.4"/>
      <rect x="17" y="24" width="5" height="5" rx="1.4"/>
      <rect x="24" y="24" width="5" height="5" rx="1.4"/>
    </g>
    <!-- logged days: they trace a check -->
    <rect x="24" y="10" width="5" height="5" rx="1.4"/>
    <rect x="17" y="17" width="5" height="5" rx="1.4"/>
    <rect x="3"  y="17" width="5" height="5" rx="1.4"/>
    <rect x="10" y="24" width="5" height="5" rx="1.4"/>
  </g>
</svg>
